<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Impara Italiano – Vokabeltrainer</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #1a1a2e;
      color: #eee;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 1rem;
    }

    h1 {
      font-size: 1.4rem;
      letter-spacing: 0.05em;
      color: #a78bfa;
      margin-bottom: 2rem;
      text-align: center;
    }

    #card {
      background: #16213e;
      border: 2px solid #a78bfa;
      border-radius: 1.5rem;
      width: 100%;
      max-width: 420px;
      padding: 2.5rem 2rem;
      text-align: center;
      box-shadow: 0 8px 40px rgba(167,139,250,0.15);
      min-height: 320px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 1.2rem;
    }

    #progress {
      font-size: 0.8rem;
      color: #6b7280;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    #word {
      font-size: 2rem;
      font-weight: 700;
      color: #f9fafb;
    }

    #timer-ring {
      position: relative;
      width: 72px;
      height: 72px;
    }

    #timer-ring svg {
      transform: rotate(-90deg);
    }

    #timer-ring circle {
      fill: none;
      stroke-width: 5;
    }

    #timer-track { stroke: #374151; }
    #timer-bar   { stroke: #a78bfa; stroke-linecap: round; transition: stroke-dashoffset 1s linear; }

    #timer-label {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.4rem;
      font-weight: 700;
      color: #a78bfa;
    }

    #mic-btn {
      background: #a78bfa;
      border: none;
      border-radius: 50%;
      width: 70px;
      height: 70px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.2s, transform 0.1s;
      flex-shrink: 0;
    }

    #mic-btn:active { transform: scale(0.94); }
    #mic-btn.listening { background: #ef4444; animation: pulse 1s infinite; }
    #mic-btn.disabled { background: #374151; cursor: default; }

    @keyframes pulse {
      0%, 100% { box-shadow: 0 0 0 0 rgba(239,68,68,0.4); }
      50%       { box-shadow: 0 0 0 12px rgba(239,68,68,0); }
    }

    #mic-icon { width: 30px; height: 30px; fill: white; }

    #heard {
      font-size: 1rem;
      color: #9ca3af;
      min-height: 1.4em;
      font-style: italic;
    }

    #feedback {
      font-size: 1.1rem;
      font-weight: 600;
      min-height: 1.4em;
    }

    .correct { color: #34d399; }
    .wrong   { color: #f87171; }

    #start-btn, #next-btn {
      background: #a78bfa;
      color: white;
      border: none;
      border-radius: 0.75rem;
      padding: 0.75rem 2rem;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s;
    }

    #start-btn:hover, #next-btn:hover { background: #7c3aed; }
    #start-btn:active, #next-btn:active { transform: scale(0.97); }

    #result-box {
      width: 100%;
      text-align: left;
    }

    #result-box h2 {
      font-size: 1.1rem;
      color: #a78bfa;
      margin-bottom: 1rem;
      text-align: center;
    }

    .result-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0.5rem 0.75rem;
      border-radius: 0.5rem;
      margin-bottom: 0.4rem;
      font-size: 0.95rem;
    }

    .result-item.ok   { background: rgba(52,211,153,0.12); color: #34d399; }
    .result-item.fail { background: rgba(248,113,113,0.12); color: #f87171; }

    #no-speech-hint {
      font-size: 0.78rem;
      color: #6b7280;
      margin-top: 0.4rem;
      text-align: center;
    }
  </style>
</head>
<body>
  <h1>🇮🇹 Impara Italiano</h1>

  <div id="card">
    <!-- Startscreen -->
    <div id="screen-start">
      <p style="color:#9ca3af;margin-bottom:1.5rem;line-height:1.6">
        5 Vokabeln werden nacheinander auf Deutsch angezeigt.<br>
        Du hast <strong style="color:#a78bfa">5 Sekunden</strong>, die italienische Übersetzung zu sagen.<br>
        Nicht gewusste Wörter werden am Ende wiederholt.
      </p>
      <button id="start-btn" onclick="startQuiz()">Starten</button>
      <p id="no-speech-hint" style="margin-top:1rem"></p>
    </div>

    <!-- Quiz screen -->
    <div id="screen-quiz" style="display:none;flex-direction:column;align-items:center;gap:1.1rem;width:100%">
      <div id="progress"></div>
      <div id="word"></div>
      <div id="timer-ring">
        <svg width="72" height="72" viewBox="0 0 72 72">
          <circle class="" id="timer-track" cx="36" cy="36" r="31"/>
          <circle id="timer-bar" cx="36" cy="36" r="31"/>
        </svg>
        <div id="timer-label">5</div>
      </div>
      <button id="mic-btn" onclick="toggleMic()">
        <svg id="mic-icon" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
          <path d="M12 1a4 4 0 0 1 4 4v6a4 4 0 0 1-8 0V5a4 4 0 0 1 4-4zm0 2a2 2 0 0 0-2 2v6a2 2 0 0 0 4 0V5a2 2 0 0 0-2-2zm6.94 7A7 7 0 0 1 5.06 10H3.05A9.004 9.004 0 0 0 11 18.94V21H9v2h6v-2h-2v-2.06A9.004 9.004 0 0 0 20.95 10h-2.01z"/>
        </svg>
      </button>
      <div id="heard"></div>
      <div id="feedback"></div>
    </div>

    <!-- Result screen -->
    <div id="screen-result" style="display:none;flex-direction:column;align-items:center;gap:1rem;width:100%">
      <div id="result-box"></div>
      <button id="next-btn" onclick="nextPhase()"></button>
    </div>
  </div>

<script>
// ── Vocabulary (A2 level) ─────────────────────────────────────────────────
const ALL_VOCAB = [
  { de: "die Reise",      it: "il viaggio",      alt: ["viaggio"] },
  { de: "der Urlaub",     it: "la vacanza",       alt: ["vacanza"] },
  { de: "das Wetter",     it: "il tempo",         alt: ["tempo"] },
  { de: "die Gesundheit", it: "la salute",        alt: ["salute"] },
  { de: "der Beruf",      it: "la professione",   alt: ["professione"] },
];

// ── State ────────────────────────────────────────────────────────────────
let queue       = [];   // words left in current round
let missed      = [];   // wrong answers for repeat
let results     = [];   // [{word, ok}]
let current     = null;
let timerInterval = null;
let timeLeft    = 5;
let recognition = null;
let listening   = false;
let answered    = false;
let repeatRound = false;

// ── Circumference for SVG ring ───────────────────────────────────────────
const CIRC = 2 * Math.PI * 31; // r=31
document.getElementById("timer-bar").style.strokeDasharray  = CIRC;
document.getElementById("timer-bar").style.strokeDashoffset = 0;

// ── Speech recognition setup ─────────────────────────────────────────────
const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
let speechSupported = !!SpeechRecognition;

if (!speechSupported) {
  document.getElementById("no-speech-hint").textContent =
    "⚠️ Dein Browser unterstützt keine Spracheingabe (empfohlen: Chrome).";
}

function buildRecognition() {
  if (!speechSupported) return null;
  const r = new SpeechRecognition();
  r.lang = "it-IT";
  r.continuous = false;
  r.interimResults = true;

  r.onresult = (e) => {
    const transcript = Array.from(e.results)
      .map(res => res[0].transcript)
      .join(" ")
      .trim()
      .toLowerCase();
    document.getElementById("heard").textContent = "„" + transcript + """;
    if (e.results[e.results.length - 1].isFinal) {
      stopMic();
      checkAnswer(transcript);
    }
  };

  r.onerror = (e) => {
    if (e.error === "no-speech") { stopMic(); timeOut(); }
    else { stopMic(); }
  };

  r.onend = () => {
    if (listening) { listening = false; setMicState("idle"); }
  };

  return r;
}

// ── Quiz control ─────────────────────────────────────────────────────────
function startQuiz() {
  queue      = shuffle([...ALL_VOCAB]);
  missed     = [];
  results    = [];
  repeatRound = false;
  showScreen("quiz");
  nextWord();
}

function nextWord() {
  answered = false;
  if (queue.length === 0) {
    showRoundResult();
    return;
  }
  current = queue.shift();
  document.getElementById("word").textContent     = current.de;
  document.getElementById("heard").textContent    = "";
  document.getElementById("feedback").textContent = "";
  document.getElementById("feedback").className   = "";
  setProgress();
  startTimer();
  autoStartMic();
}

function startTimer() {
  clearInterval(timerInterval);
  timeLeft = 5;
  updateRing(5);
  document.getElementById("timer-label").textContent = "5";

  timerInterval = setInterval(() => {
    timeLeft--;
    updateRing(timeLeft);
    document.getElementById("timer-label").textContent = timeLeft;
    if (timeLeft <= 0) {
      clearInterval(timerInterval);
      if (!answered) timeOut();
    }
  }, 1000);
}

function updateRing(t) {
  const offset = CIRC - (t / 5) * CIRC;
  document.getElementById("timer-bar").style.strokeDashoffset = offset;
  document.getElementById("timer-bar").style.stroke =
    t <= 2 ? "#f87171" : t <= 3 ? "#fbbf24" : "#a78bfa";
  document.getElementById("timer-label").style.color =
    t <= 2 ? "#f87171" : t <= 3 ? "#fbbf24" : "#a78bfa";
}

function timeOut() {
  if (answered) return;
  answered = true;
  stopMic();
  markWrong("⏱ Zeit! → " + current.it);
  setTimeout(nextWord, 1800);
}

function checkAnswer(transcript) {
  if (answered) return;
  answered = true;
  clearInterval(timerInterval);

  const acceptable = [current.it.toLowerCase(), ...current.alt.map(a => a.toLowerCase())];
  const ok = acceptable.some(a => transcript.includes(a));

  if (ok) {
    document.getElementById("feedback").textContent = "✓ Richtig!";
    document.getElementById("feedback").className   = "correct";
    results.push({ word: current, ok: true });
  } else {
    markWrong("✗ Falsch → " + current.it);
  }
  setTimeout(nextWord, 1600);
}

function markWrong(msg) {
  document.getElementById("feedback").textContent = msg;
  document.getElementById("feedback").className   = "wrong";
  missed.push(current);
  results.push({ word: current, ok: false });
}

// ── Round result ─────────────────────────────────────────────────────────
function showRoundResult() {
  stopMic();
  const box = document.getElementById("result-box");
  const btn = document.getElementById("next-btn");

  let html = `<h2>${repeatRound ? "Wiederholung" : "Runde"} abgeschlossen</h2>`;
  results.forEach(r => {
    html += `<div class="result-item ${r.ok ? "ok" : "fail"}">
      <span>${r.word.de}</span>
      <span>${r.word.it}</span>
    </div>`;
  });
  box.innerHTML = html;

  if (missed.length > 0 && !repeatRound) {
    btn.textContent = `${missed.length} Wort${missed.length > 1 ? "e" : ""} wiederholen →`;
    btn.onclick = startRepeat;
  } else {
    btn.textContent = "Neu starten";
    btn.onclick = startQuiz;
  }

  showScreen("result");
}

function startRepeat() {
  queue       = shuffle([...missed]);
  missed      = [];
  results     = [];
  repeatRound = true;
  showScreen("quiz");
  nextWord();
}

function nextPhase() {} // overwritten dynamically above

// ── Mic controls ─────────────────────────────────────────────────────────
function autoStartMic() {
  if (!speechSupported) return;
  setTimeout(() => { if (!answered) startMic(); }, 300);
}

function toggleMic() {
  if (!speechSupported) return;
  if (listening) stopMic(); else startMic();
}

function startMic() {
  if (!speechSupported || listening) return;
  recognition = buildRecognition();
  try {
    recognition.start();
    listening = true;
    setMicState("listening");
  } catch(e) {}
}

function stopMic() {
  if (!recognition) return;
  try { recognition.stop(); } catch(e) {}
  listening = false;
  setMicState("idle");
}

function setMicState(state) {
  const btn = document.getElementById("mic-btn");
  btn.className = state === "listening" ? "listening"
                : state === "disabled"  ? "disabled" : "";
}

// ── Helpers ──────────────────────────────────────────────────────────────
function setProgress() {
  const total = ALL_VOCAB.length;
  const done  = total - queue.length;
  document.getElementById("progress").textContent =
    `Wort ${done} / ${total}${repeatRound ? " · Wiederholung" : ""}`;
}

function showScreen(name) {
  ["start","quiz","result"].forEach(s => {
    const el = document.getElementById("screen-" + s);
    el.style.display = s === name ? "flex" : "none";
  });
}

function shuffle(arr) {
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}
</script>
</body>
</html>
