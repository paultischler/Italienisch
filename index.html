<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>Impara Italiano</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #1a1a2e; color: #eee;
      min-height: 100vh;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      padding: 1rem;
    }

    h1 { font-size: 1.3rem; color: #a78bfa; margin-bottom: 1.5rem; text-align: center; }

    #card {
      background: #16213e; border: 2px solid #a78bfa;
      border-radius: 1.5rem; width: 100%; max-width: 420px;
      padding: 2rem 1.5rem; text-align: center;
      box-shadow: 0 8px 40px rgba(167,139,250,0.15);
    }

    .screen { display: none; }
    .screen.active { display: block; }

    #screen-start p { color: #9ca3af; line-height: 1.7; margin-bottom: 1rem; }

    #progress {
      font-size: 0.78rem; color: #6b7280;
      text-transform: uppercase; margin-bottom: 1rem; letter-spacing: 0.06em;
    }
    #word {
      font-size: 2rem; font-weight: 700;
      color: #f9fafb; margin-bottom: 1.2rem; min-height: 2.5rem;
    }

    #timer-wrap { display: flex; align-items: center; justify-content: center; margin-bottom: 1.1rem; }
    #timer-display {
      width: 60px; height: 60px; border-radius: 50%;
      border: 5px solid #a78bfa;
      display: flex; align-items: center; justify-content: center;
      font-size: 1.4rem; font-weight: 700; color: #a78bfa;
      transition: border-color 0.3s, color 0.3s;
    }
    #timer-display.warn   { border-color: #fbbf24; color: #fbbf24; }
    #timer-display.urgent { border-color: #f87171; color: #f87171; }
    #timer-display.grace  { border-color: #374151; color: #6b7280; font-size: 1rem; }

    #mic-status { font-size: 0.8rem; margin-bottom: 0.8rem; min-height: 1.1em; }

    #input-row { display: flex; gap: 0.6rem; margin-bottom: 0.8rem; }
    #answer-input {
      flex: 1; background: #0f172a;
      border: 1.5px solid #374151; border-radius: 0.6rem;
      color: #f9fafb; font-size: 1rem; padding: 0.65rem 0.8rem; outline: none;
    }
    #answer-input:focus { border-color: #a78bfa; }
    #answer-input::placeholder { color: #4b5563; }
    #send-btn {
      background: #7c3aed; border: none; border-radius: 0.6rem;
      color: white; font-size: 0.9rem; font-weight: 700;
      padding: 0 1.1rem; cursor: pointer; -webkit-appearance: none;
    }

    #heard    { font-size: 0.85rem; color: #9ca3af; min-height: 1.1em; font-style: italic; margin-bottom: 0.4rem; }
    #feedback { font-size: 1.05rem; font-weight: 700; min-height: 1.3em; }
    .correct  { color: #34d399; }
    .wrong    { color: #f87171; }

    .btn {
      display: inline-block; background: #a78bfa; color: white; border: none;
      border-radius: 0.75rem; padding: 0.8rem 2rem;
      font-size: 1rem; font-weight: 700; cursor: pointer;
      margin-top: 0.5rem; -webkit-appearance: none;
    }

    #result-box { text-align: left; margin-bottom: 1rem; }
    #result-box h2 { font-size: 1rem; color: #a78bfa; text-align: center; margin-bottom: 0.8rem; }
    .ri {
      display: flex; justify-content: space-between; align-items: center;
      padding: 0.5rem 0.7rem; border-radius: 0.45rem; margin-bottom: 0.35rem; font-size: 0.9rem;
    }
    .ri.ok   { background: rgba(52,211,153,0.12); color: #34d399; }
    .ri.some { background: rgba(251,191,36,0.12);  color: #fbbf24; }
    .wrong-count { font-size: 0.75rem; opacity: 0.75; margin-left: 0.4rem; }

    #dots { display: flex; gap: 0.4rem; justify-content: center; margin-bottom: 1.1rem; flex-wrap: wrap; }
    .dot { width: 12px; height: 12px; border-radius: 50%; background: #374151; transition: background 0.3s; }
    .dot.done    { background: #34d399; }
    .dot.current { background: #a78bfa; }

    #joker-row { display: flex; align-items: center; justify-content: center; gap: 0.5rem; margin-bottom: 0.9rem; }
    #joker-btn {
      background: #0f172a; border: 1.5px solid #fbbf24; border-radius: 2rem;
      color: #fbbf24; font-size: 0.85rem; font-weight: 700;
      padding: 0.35rem 0.9rem; cursor: pointer; -webkit-appearance: none;
      transition: background 0.2s, opacity 0.2s;
    }
    #joker-btn:active { background: #1e293b; }
    #joker-btn:disabled { opacity: 0.3; cursor: default; border-color: #374151; color: #6b7280; }
    #joker-pips { display: flex; gap: 0.35rem; align-items: center; }
    .pip { width: 10px; height: 10px; border-radius: 50%; background: #fbbf24; transition: background 0.3s; }
    .pip.used { background: #374151; }
  </style>
</head>
<body>
  <h1>&#127470;&#127481; Impara Italiano</h1>
  <div id="card">

    <div id="screen-start" class="screen active">
      <p>5 Vokabeln auf Deutsch &mdash; sprich oder tippe die italienische &Uuml;bersetzung.<br>
         Du hast jeweils <strong style="color:#a78bfa">5 Sekunden</strong>.<br>
         Falsche Antworten werden wiederholt, bis alle richtig sind.</p>
      <br>
      <button class="btn" id="start-btn">Starten</button>
    </div>

    <div id="screen-quiz" class="screen">
      <div id="progress"></div>
      <div id="dots"></div>
      <div id="word"></div>
      <div id="timer-wrap"><div id="timer-display">5</div></div>
      <div id="joker-row">
        <button id="joker-btn">+3s</button>
        <div id="joker-pips"></div>
      </div>
      <div id="mic-status"></div>
      <div id="input-row">
        <input id="answer-input" type="text" placeholder="Italiano&hellip;"
               autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" />
        <button id="send-btn">OK</button>
      </div>
      <div id="heard"></div>
      <div id="feedback"></div>
    </div>

    <div id="screen-result" class="screen">
      <div id="result-box"></div>
      <button class="btn" id="next-btn">Neu starten</button>
    </div>

  </div>
<script>
(function () {
  'use strict';

  var VOCAB = [
    { de: 'die Reise',      it: 'il viaggio',    alt: ['viaggio'] },
    { de: 'der Urlaub',     it: 'la vacanza',     alt: ['vacanza'] },
    { de: 'das Wetter',     it: 'il tempo',       alt: ['tempo'] },
    { de: 'die Gesundheit', it: 'la salute',      alt: ['salute'] },
    { de: 'der Beruf',      it: 'la professione', alt: ['professione'] }
  ];

  // ── State ─────────────────────────────────────────────────────────────
  var queue = [], correctSet = {}, wrongCounts = {}, current = null;
  var timerInterval = null, timeLeft = 5;
  var recognition = null, quizActive = false, answered = false;
  var wordToken = 0;   // increments with every new word; stale results carry old token
  var jokersLeft = 3;  // Zeit-Joker per round

  // ── DOM ───────────────────────────────────────────────────────────────
  var elProgress  = document.getElementById('progress');
  var elDots      = document.getElementById('dots');
  var elWord      = document.getElementById('word');
  var elTimer     = document.getElementById('timer-display');
  var elMicStatus = document.getElementById('mic-status');
  var elInput     = document.getElementById('answer-input');
  var elHeard     = document.getElementById('heard');
  var elFeedback  = document.getElementById('feedback');
  var elResult    = document.getElementById('result-box');
  var elNext      = document.getElementById('next-btn');
  var elJokerBtn  = document.getElementById('joker-btn');
  var elJokerPips = document.getElementById('joker-pips');

  // ── Speech API ────────────────────────────────────────────────────────
  var SpeechAPI = null;
  try { SpeechAPI = window.SpeechRecognition || window.webkitSpeechRecognition || null; } catch (e) {}

  // ── Buttons ───────────────────────────────────────────────────────────
  document.getElementById('start-btn').onclick = startQuiz;
  document.getElementById('send-btn').onclick  = onSend;
  elJokerBtn.onclick = useJoker;
  elNext.onclick = startQuiz;
  elInput.addEventListener('keydown', function (e) {
    if (e.keyCode === 13 || e.key === 'Enter') onSend();
  });

  // ── Quiz control ──────────────────────────────────────────────────────
  function startQuiz() {
    queue = shuffle(VOCAB.slice());
    correctSet = {}; wrongCounts = {};
    VOCAB.forEach(function (v) { wrongCounts[v.de] = 0; });
    jokersLeft = 3;
    quizActive = true;
    showScreen('quiz');
    renderJokers();
    nextWord();
  }

  function nextWord() {
    if (!quizActive) return;
    wordToken++;                   // new token — makes all in-flight results invalid
    var token = wordToken;
    answered = false;

    stopRecognition();             // clean up previous recognition cleanly
    elInput.value = ''; elHeard.textContent = '';
    elFeedback.textContent = ''; elFeedback.className = '';

    if (queue.length === 0) { finishQuiz(); return; }

    current = queue.shift();
    elWord.textContent = current.de;
    updateDots(); updateProgress();
    startTimer(token);
    startWordRecognition(token);   // fresh recognition tied to this token
  }

  // ── Joker ─────────────────────────────────────────────────────────────
  function useJoker() {
    if (jokersLeft <= 0 || answered) return;
    jokersLeft--;
    renderJokers();
    if (timeLeft > 0) {
      timeLeft += 3;
      renderTimer(timeLeft, timeLeft <= 2 ? 'urgent' : timeLeft <= 3 ? 'warn' : '');
    }
  }

  function renderJokers() {
    var html = '';
    for (var i = 0; i < 3; i++) {
      html += '<div class="pip' + (i >= jokersLeft ? ' used' : '') + '"></div>';
    }
    elJokerPips.innerHTML = html;
    elJokerBtn.disabled = jokersLeft <= 0;
  }

  // ── Timer ─────────────────────────────────────────────────────────────
  function startTimer(token) {
    clearInterval(timerInterval);
    timeLeft = 5;
    renderTimer(5, '');

    timerInterval = setInterval(function () {
      if (wordToken !== token) { clearInterval(timerInterval); return; }
      timeLeft--;
      if (timeLeft > 0) {
        renderTimer(timeLeft, timeLeft <= 2 ? 'urgent' : timeLeft <= 3 ? 'warn' : '');
      } else {
        clearInterval(timerInterval);
        renderTimer('…', 'grace');   // show grace indicator
        // Give recognition 1.5 s to deliver an in-flight result before timing out
        setTimeout(function () {
          if (wordToken === token && !answered) timeOut();
        }, 1500);
      }
    }, 1000);
  }

  function renderTimer(val, cls) {
    elTimer.textContent = val;
    elTimer.className   = cls || '';
  }

  // ── Answer handling ───────────────────────────────────────────────────
  function timeOut() {
    if (answered) return;
    answered = true;
    stopRecognition();
    wrongCounts[current.de]++;
    queue.push(current);
    elFeedback.textContent = '⏱ Zeit! → ' + current.it;
    elFeedback.className   = 'wrong';
    setTimeout(nextWord, 1900);
  }

  function onSend() {
    if (answered) return;
    var val = elInput.value.replace(/^\s+|\s+$/g, '').toLowerCase();
    if (!val) return;
    answered = true;
    clearInterval(timerInterval);
    evaluate(val);
  }

  function evaluate(text) {
    var ok = [current.it.toLowerCase()]
      .concat(current.alt.map(function (a) { return a.toLowerCase(); }))
      .some(function (a) { return text.indexOf(a) !== -1; });

    if (ok) {
      correctSet[current.de] = true;
      elFeedback.textContent = '✓ Richtig!';
      elFeedback.className   = 'correct';
    } else {
      wrongCounts[current.de]++;
      queue.push(current);
      elFeedback.textContent = '✗ Falsch → ' + current.it;
      elFeedback.className   = 'wrong';
    }
    updateDots();
    setTimeout(nextWord, 1700);
  }

  // ── Finish ────────────────────────────────────────────────────────────
  function finishQuiz() {
    quizActive = false;
    stopRecognition();
    clearInterval(timerInterval);

    var html = '<h2>Geschafft! &#127881;</h2>';
    VOCAB.forEach(function (v) {
      var c = wrongCounts[v.de], cls = c === 0 ? 'ok' : 'some';
      html += '<div class="ri ' + cls + '"><span>' + v.de + '</span><span>' + v.it;
      if (c > 0) html += '<span class="wrong-count">' + c + '&times; falsch</span>';
      html += '</span></div>';
    });
    elResult.innerHTML = html;
    elNext.onclick = startQuiz;
    showScreen('result');
  }

  // ── Progress ──────────────────────────────────────────────────────────
  function updateProgress() {
    elProgress.textContent = Object.keys(correctSet).length + ' / ' + VOCAB.length + ' richtig';
  }

  function updateDots() {
    var html = '';
    VOCAB.forEach(function (v) {
      var cls = correctSet[v.de] ? 'dot done'
              : (current && v.de === current.de ? 'dot current' : 'dot');
      html += '<div class="' + cls + '" title="' + v.de + '"></div>';
    });
    elDots.innerHTML = html;
  }

  // ── Recognition ───────────────────────────────────────────────────────
  // Each word gets its own `token`. Results arriving after a token change
  // are silently discarded — this prevents ANY stale-result cross-contamination.
  function startWordRecognition(token) {
    if (!SpeechAPI) { setMicStatus('text'); return; }
    try {
      var rec = new SpeechAPI();
      rec.lang = 'it-IT';
      rec.continuous     = false;   // single-utterance: stops automatically after speech
      rec.interimResults = true;

      rec.onresult = function (e) {
        if (wordToken !== token || answered) return;   // wrong word → discard
        var last = e.results[e.results.length - 1];
        var t    = last[0].transcript.toLowerCase().replace(/^\s+|\s+$/g, '');
        elInput.value       = t;
        elHeard.textContent = '„' + t + '"';
        if (last.isFinal) {
          answered = true;
          clearInterval(timerInterval);
          stopRecognition();
          evaluate(t);
        }
      };

      rec.onerror = function (e) {
        if (wordToken !== token || answered) return;
        // no-speech / aborted are harmless — onend will restart
        if (e.error !== 'no-speech' && e.error !== 'aborted') setMicStatus('error');
      };

      rec.onend = function () {
        if (wordToken !== token || answered) return;
        // Session ended without a final result — restart immediately to keep listening
        try {
          rec.start();       // try restarting same object (stays in audio session on iOS)
        } catch (ex) {
          // Fallback: create a fresh instance
          setTimeout(function () {
            if (wordToken === token && !answered) startWordRecognition(token);
          }, 150);
        }
      };

      rec.start();
      recognition = rec;
      setMicStatus('on');
    } catch (e) {
      SpeechAPI = null;
      setMicStatus('text');
    }
  }

  function stopRecognition() {
    if (recognition) {
      var r = recognition;
      recognition = null;          // clear first so onend restart is a no-op
      try { r.stop(); } catch (e) {}
    }
  }

  function setMicStatus(state) {
    var map = { on: ['#34d399', '🎙️ Mikrofon aktiv'], text: ['#6b7280', '⌨️ Texteingabe'],
                error: ['#f87171', '⚠️ Mikrofon-Fehler'], off: ['', ''] };
    var s = map[state] || map.off;
    elMicStatus.style.color = s[0];
    elMicStatus.textContent = s[1];
  }

  // ── Helpers ───────────────────────────────────────────────────────────
  function showScreen(name) {
    var screens = document.querySelectorAll('.screen');
    for (var i = 0; i < screens.length; i++) {
      screens[i].className = 'screen' + (screens[i].id === 'screen-' + name ? ' active' : '');
    }
  }

  function shuffle(arr) {
    for (var i = arr.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var tmp = arr[i]; arr[i] = arr[j]; arr[j] = tmp;
    }
    return arr;
  }

}());
</script>
</body>
</html>
