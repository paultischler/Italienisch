<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>Impara Italiano</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #1a1a2e;
      color: #eee;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 1rem;
    }

    h1 { font-size: 1.3rem; color: #a78bfa; margin-bottom: 1.5rem; text-align: center; }

    #card {
      background: #16213e;
      border: 2px solid #a78bfa;
      border-radius: 1.5rem;
      width: 100%;
      max-width: 420px;
      padding: 2rem 1.5rem;
      text-align: center;
      box-shadow: 0 8px 40px rgba(167,139,250,0.15);
    }

    .screen { display: none; }
    .screen.active { display: block; }

    #screen-start p { color: #9ca3af; line-height: 1.7; margin-bottom: 1rem; }

    #progress {
      font-size: 0.78rem; color: #6b7280;
      text-transform: uppercase; margin-bottom: 1rem;
      letter-spacing: 0.06em;
    }

    #word {
      font-size: 2rem; font-weight: 700;
      color: #f9fafb; margin-bottom: 1.2rem; min-height: 2.5rem;
    }

    #timer-wrap { display: flex; align-items: center; justify-content: center; margin-bottom: 1.2rem; }
    #timer-display {
      width: 60px; height: 60px; border-radius: 50%;
      border: 5px solid #a78bfa;
      display: flex; align-items: center; justify-content: center;
      font-size: 1.4rem; font-weight: 700; color: #a78bfa;
      transition: border-color 0.3s, color 0.3s;
    }
    #timer-display.warn   { border-color: #fbbf24; color: #fbbf24; }
    #timer-display.urgent { border-color: #f87171; color: #f87171; }

    #mic-status {
      font-size: 0.8rem; margin-bottom: 0.8rem; min-height: 1.1em;
      transition: color 0.3s;
    }

    #input-row { display: flex; gap: 0.6rem; margin-bottom: 0.8rem; }
    #answer-input {
      flex: 1; background: #0f172a;
      border: 1.5px solid #374151; border-radius: 0.6rem;
      color: #f9fafb; font-size: 1rem; padding: 0.65rem 0.8rem; outline: none;
    }
    #answer-input:focus { border-color: #a78bfa; }
    #answer-input::placeholder { color: #4b5563; }

    #send-btn {
      background: #7c3aed; border: none; border-radius: 0.6rem;
      color: white; font-size: 0.9rem; font-weight: 700;
      padding: 0 1.1rem; cursor: pointer;
      -webkit-appearance: none;
    }

    #heard    { font-size: 0.85rem; color: #9ca3af; min-height: 1.1em; font-style: italic; margin-bottom: 0.4rem; }
    #feedback { font-size: 1.05rem; font-weight: 700; min-height: 1.3em; }
    .correct  { color: #34d399; }
    .wrong    { color: #f87171; }

    .btn {
      display: inline-block;
      background: #a78bfa; color: white; border: none;
      border-radius: 0.75rem; padding: 0.8rem 2rem;
      font-size: 1rem; font-weight: 700; cursor: pointer;
      margin-top: 0.5rem; -webkit-appearance: none;
    }

    #result-box { text-align: left; margin-bottom: 1rem; }
    #result-box h2 { font-size: 1rem; color: #a78bfa; text-align: center; margin-bottom: 0.8rem; }
    .ri {
      display: flex; justify-content: space-between; align-items: center;
      padding: 0.5rem 0.7rem; border-radius: 0.45rem;
      margin-bottom: 0.35rem; font-size: 0.9rem;
    }
    .ri.ok   { background: rgba(52,211,153,0.12); color: #34d399; }
    .ri.some { background: rgba(251,191,36,0.12);  color: #fbbf24; }
    .wrong-count { font-size: 0.75rem; opacity: 0.75; margin-left: 0.4rem; }

    #dots { display: flex; gap: 0.4rem; justify-content: center; margin-bottom: 1.1rem; flex-wrap: wrap; }
    .dot {
      width: 12px; height: 12px; border-radius: 50%;
      background: #374151; transition: background 0.3s;
    }
    .dot.done { background: #34d399; }
    .dot.current { background: #a78bfa; }
  </style>
</head>
<body>
  <h1>&#127470;&#127481; Impara Italiano</h1>

  <div id="card">

    <div id="screen-start" class="screen active">
      <p>5 Vokabeln auf Deutsch &mdash; sprich oder tippe die italienische &Uuml;bersetzung.<br>
         Du hast jeweils <strong style="color:#a78bfa">5 Sekunden</strong>.<br>
         Falsche Antworten werden wiederholt, bis alle richtig sind.</p>
      <br>
      <button class="btn" id="start-btn">Starten</button>
    </div>

    <div id="screen-quiz" class="screen">
      <div id="progress"></div>
      <div id="dots"></div>
      <div id="word"></div>
      <div id="timer-wrap"><div id="timer-display">5</div></div>
      <div id="mic-status"></div>
      <div id="input-row">
        <input id="answer-input" type="text" placeholder="Italiano&hellip;"
               autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" />
        <button id="send-btn">OK</button>
      </div>
      <div id="heard"></div>
      <div id="feedback"></div>
    </div>

    <div id="screen-result" class="screen">
      <div id="result-box"></div>
      <button class="btn" id="next-btn">Neu starten</button>
    </div>

  </div>

<script>
(function () {
  'use strict';

  var VOCAB = [
    { de: 'die Reise',      it: 'il viaggio',    alt: ['viaggio'] },
    { de: 'der Urlaub',     it: 'la vacanza',     alt: ['vacanza'] },
    { de: 'das Wetter',     it: 'il tempo',       alt: ['tempo'] },
    { de: 'die Gesundheit', it: 'la salute',      alt: ['salute'] },
    { de: 'der Beruf',      it: 'la professione', alt: ['professione'] }
  ];

  var queue       = [];
  var correctSet  = {};
  var wrongCounts = {};
  var current     = null;
  var timerInterval = null, timeLeft = 5;
  var recognition   = null, quizActive = false, answered = false;
  var processedIdx  = 0;

  var elProgress  = document.getElementById('progress');
  var elDots      = document.getElementById('dots');
  var elWord      = document.getElementById('word');
  var elTimer     = document.getElementById('timer-display');
  var elMicStatus = document.getElementById('mic-status');
  var elInput     = document.getElementById('answer-input');
  var elHeard     = document.getElementById('heard');
  var elFeedback  = document.getElementById('feedback');
  var elResult    = document.getElementById('result-box');
  var elNext      = document.getElementById('next-btn');

  var SpeechAPI = null;
  try { SpeechAPI = window.SpeechRecognition || window.webkitSpeechRecognition || null; } catch (e) {}

  document.getElementById('start-btn').onclick = startQuiz;
  document.getElementById('send-btn').onclick  = onSend;
  elNext.onclick = startQuiz;
  elInput.addEventListener('keydown', function (e) {
    if (e.keyCode === 13 || e.key === 'Enter') onSend();
  });

  function startQuiz() {
    queue      = shuffle(VOCAB.slice());
    correctSet = {};
    wrongCounts = {};
    VOCAB.forEach(function (v) { wrongCounts[v.de] = 0; });
    quizActive = true;
    showScreen('quiz');
    startRecognition();
    nextWord();
  }

  function nextWord() {
    if (!quizActive) return;
    answered = false;
    elInput.value          = '';
    elHeard.textContent    = '';
    elFeedback.textContent = '';
    elFeedback.className   = '';

    if (queue.length === 0) { finishQuiz(); return; }

    current = queue.shift();
    elWord.textContent = current.de;
    updateDots();
    updateProgress();
    startTimer();
  }

  function startTimer() {
    clearInterval(timerInterval);
    timeLeft = 5;
    renderTimer(5);
    timerInterval = setInterval(function () {
      timeLeft--;
      renderTimer(timeLeft);
      if (timeLeft <= 0) { clearInterval(timerInterval); if (!answered) timeOut(); }
    }, 1000);
  }

  function renderTimer(t) {
    elTimer.textContent = t;
    elTimer.className   = t <= 2 ? 'urgent' : t <= 3 ? 'warn' : '';
  }

  function timeOut() {
    if (answered) return;
    answered = true;
    wrongCounts[current.de]++;
    queue.push(current);
    elFeedback.textContent = '⏱ Zeit! → ' + current.it;
    elFeedback.className   = 'wrong';
    setTimeout(nextWord, 1900);
  }

  function onSend() {
    if (answered) return;
    var val = elInput.value.replace(/^\s+|\s+$/g, '').toLowerCase();
    if (!val) return;
    answered = true;
    clearInterval(timerInterval);
    evaluate(val);
  }

  function evaluate(text) {
    var ok = [current.it.toLowerCase()]
      .concat(current.alt.map(function (a) { return a.toLowerCase(); }))
      .some(function (a) { return text.indexOf(a) !== -1; });

    if (ok) {
      correctSet[current.de] = true;
      elFeedback.textContent = '✓ Richtig!';
      elFeedback.className   = 'correct';
    } else {
      wrongCounts[current.de]++;
      queue.push(current);
      elFeedback.textContent = '✗ Falsch → ' + current.it;
      elFeedback.className   = 'wrong';
    }
    updateDots();
    setTimeout(nextWord, 1700);
  }

  function finishQuiz() {
    quizActive = false;
    stopRecognition();
    clearInterval(timerInterval);

    var html = '<h2>Geschafft! &#127881;</h2>';
    VOCAB.forEach(function (v) {
      var c = wrongCounts[v.de];
      var cls = c === 0 ? 'ok' : 'some';
      html += '<div class="ri ' + cls + '"><span>' + v.de + '</span><span>' + v.it;
      if (c > 0) {
        html += '<span class="wrong-count">' + c + '&times; falsch</span>';
      }
      html += '</span></div>';
    });
    elResult.innerHTML = html;
    elNext.onclick = startQuiz;
    showScreen('result');
  }

  function updateProgress() {
    var done = Object.keys(correctSet).length;
    elProgress.textContent = done + ' / ' + VOCAB.length + ' richtig';
  }

  function updateDots() {
    var html = '';
    VOCAB.forEach(function (v) {
      var cls = correctSet[v.de]
        ? 'dot done'
        : (current && v.de === current.de ? 'dot current' : 'dot');
      html += '<div class="' + cls + '" title="' + v.de + '"></div>';
    });
    elDots.innerHTML = html;
  }

  function startRecognition() {
    if (!SpeechAPI) { setMicStatus('text'); return; }
    processedIdx = 0;
    launchRecognition();
  }

  function launchRecognition() {
    if (!quizActive || !SpeechAPI) return;
    try {
      recognition = new SpeechAPI();
      recognition.lang = 'it-IT';
      recognition.continuous     = true;
      recognition.interimResults = true;

      recognition.onresult = function (e) {
        if (answered || !quizActive) return;
        for (var i = processedIdx; i < e.results.length; i++) {
          var r = e.results[i];
          var t = r[0].transcript.toLowerCase().replace(/^\s+|\s+$/g, '');
          if (r.isFinal) {
            processedIdx = i + 1;
            elInput.value       = t;
            elHeard.textContent = '„' + t + '“';
            if (!answered) { answered = true; clearInterval(timerInterval); evaluate(t); }
            break;
          } else {
            elInput.value       = t;
            elHeard.textContent = '„' + t + '“';
          }
        }
      };

      recognition.onerror = function (e) {
        if (e.error === 'no-speech' || e.error === 'aborted') return;
        setMicStatus('error');
      };

      recognition.onend = function () {
        if (quizActive) {
          processedIdx = 0;
          setTimeout(function () { if (quizActive) launchRecognition(); }, 300);
        }
      };

      recognition.start();
      setMicStatus('on');
    } catch (e) {
      SpeechAPI = null;
      setMicStatus('text');
    }
  }

  function stopRecognition() {
    if (recognition) { try { recognition.stop(); } catch (e) {} recognition = null; }
    setMicStatus('off');
  }

  function setMicStatus(state) {
    if (state === 'on') {
      elMicStatus.style.color = '#34d399';
      elMicStatus.textContent = '🎙️ Mikrofon aktiv';
    } else if (state === 'text') {
      elMicStatus.style.color = '#6b7280';
      elMicStatus.textContent = '⌨️ Texteingabe';
    } else if (state === 'error') {
      elMicStatus.style.color = '#f87171';
      elMicStatus.textContent = '⚠️ Mikrofon-Fehler';
    } else {
      elMicStatus.textContent = '';
    }
  }

  function showScreen(name) {
    var screens = document.querySelectorAll('.screen');
    for (var i = 0; i < screens.length; i++) {
      screens[i].className = 'screen' + (screens[i].id === 'screen-' + name ? ' active' : '');
    }
  }

  function shuffle(arr) {
    for (var i = arr.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var tmp = arr[i]; arr[i] = arr[j]; arr[j] = tmp;
    }
    return arr;
  }

}());
</script>
</body>
</html>
