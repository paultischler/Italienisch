<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>Impara Italiano</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #1a1a2e;
      color: #eee;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 1rem;
    }

    h1 { font-size: 1.3rem; color: #a78bfa; margin-bottom: 1.5rem; text-align: center; }

    #card {
      background: #16213e;
      border: 2px solid #a78bfa;
      border-radius: 1.5rem;
      width: 100%;
      max-width: 420px;
      padding: 2rem 1.5rem;
      text-align: center;
      box-shadow: 0 8px 40px rgba(167,139,250,0.15);
    }

    .screen { display: none; }
    .screen.active { display: block; }

    /* ── Start ── */
    #screen-start p { color: #9ca3af; line-height: 1.7; margin-bottom: 1rem; }

    /* ── Quiz ── */
    #progress { font-size: 0.78rem; color: #6b7280; text-transform: uppercase; margin-bottom: 1rem; }
    #word { font-size: 2rem; font-weight: 700; color: #f9fafb; margin-bottom: 1.2rem; min-height: 2.5rem; }

    #timer-wrap {
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 1.2rem;
    }
    #timer-display {
      width: 60px; height: 60px;
      border-radius: 50%;
      border: 5px solid #a78bfa;
      display: flex; align-items: center; justify-content: center;
      font-size: 1.4rem; font-weight: 700; color: #a78bfa;
      transition: border-color 0.3s, color 0.3s;
    }
    #timer-display.warn  { border-color: #fbbf24; color: #fbbf24; }
    #timer-display.urgent { border-color: #f87171; color: #f87171; }

    #input-row { display: flex; gap: 0.6rem; margin-bottom: 0.8rem; }
    #answer-input {
      flex: 1;
      background: #0f172a;
      border: 1.5px solid #374151;
      border-radius: 0.6rem;
      color: #f9fafb;
      font-size: 1rem;
      padding: 0.65rem 0.8rem;
      outline: none;
    }
    #answer-input:focus { border-color: #a78bfa; }
    #answer-input::placeholder { color: #4b5563; }

    #send-btn {
      background: #7c3aed; border: none; border-radius: 0.6rem;
      color: white; font-size: 0.9rem; font-weight: 700;
      padding: 0 1.1rem; cursor: pointer;
    }

    #heard { font-size: 0.85rem; color: #9ca3af; min-height: 1.1em; font-style: italic; margin-bottom: 0.4rem; }
    #feedback { font-size: 1.05rem; font-weight: 700; min-height: 1.3em; }
    .correct { color: #34d399; }
    .wrong   { color: #f87171; }

    #mic-btn {
      display: none;
      margin: 0.6rem auto 0;
      background: #a78bfa; border: none; border-radius: 2rem;
      color: white; font-size: 0.9rem; font-weight: 600;
      padding: 0.55rem 1.4rem; cursor: pointer;
    }
    #mic-btn.listening { background: #ef4444; }

    /* ── Buttons ── */
    .btn {
      display: inline-block;
      background: #a78bfa; color: white; border: none;
      border-radius: 0.75rem; padding: 0.8rem 2rem;
      font-size: 1rem; font-weight: 700; cursor: pointer;
      margin-top: 0.5rem;
      -webkit-appearance: none;
    }

    /* ── Results ── */
    #result-box { text-align: left; margin-bottom: 1rem; }
    #result-box h2 { font-size: 1rem; color: #a78bfa; text-align: center; margin-bottom: 0.8rem; }
    .ri {
      display: flex; justify-content: space-between;
      padding: 0.45rem 0.7rem; border-radius: 0.45rem; margin-bottom: 0.35rem; font-size: 0.9rem;
    }
    .ri.ok   { background: rgba(52,211,153,0.15); color: #34d399; }
    .ri.fail { background: rgba(248,113,113,0.15); color: #f87171; }

    #mode-hint { font-size: 0.75rem; color: #6b7280; margin-bottom: 0.8rem; }
  </style>
</head>
<body>
  <h1>&#127470;&#127481; Impara Italiano</h1>

  <div id="card">

    <div id="screen-start" class="screen active">
      <p>5 Vokabeln auf Deutsch &mdash; du hast <strong style="color:#a78bfa">5 Sekunden</strong> die italienische &Uuml;bersetzung einzugeben.</p>
      <div id="mode-hint"></div>
      <button class="btn" id="start-btn">Starten</button>
    </div>

    <div id="screen-quiz" class="screen">
      <div id="progress"></div>
      <div id="word"></div>
      <div id="timer-wrap"><div id="timer-display">5</div></div>
      <div id="input-row">
        <input id="answer-input" type="text" placeholder="Italiano&hellip;"
               autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" />
        <button id="send-btn">OK</button>
      </div>
      <div id="heard"></div>
      <div id="feedback"></div>
      <button id="mic-btn">&#127908; Sprechen</button>
    </div>

    <div id="screen-result" class="screen">
      <div id="result-box"></div>
      <button class="btn" id="next-btn">-</button>
    </div>

  </div>

<script>
(function () {
  'use strict';

  var VOCAB = [
    { de: 'die Reise',      it: 'il viaggio',     alt: ['viaggio'] },
    { de: 'der Urlaub',     it: 'la vacanza',      alt: ['vacanza'] },
    { de: 'das Wetter',     it: 'il tempo',        alt: ['tempo'] },
    { de: 'die Gesundheit', it: 'la salute',       alt: ['salute'] },
    { de: 'der Beruf',      it: 'la professione',  alt: ['professione'] }
  ];

  var queue = [], missed = [], results = [], current = null;
  var timerInterval = null, timeLeft = 5;
  var recognition = null, listening = false, answered = false, repeatRound = false;

  // ── DOM refs ──────────────────────────────────────────────────────────
  var elProgress = document.getElementById('progress');
  var elWord     = document.getElementById('word');
  var elTimer    = document.getElementById('timer-display');
  var elInput    = document.getElementById('answer-input');
  var elHeard    = document.getElementById('heard');
  var elFeedback = document.getElementById('feedback');
  var elMic      = document.getElementById('mic-btn');
  var elResult   = document.getElementById('result-box');
  var elNext     = document.getElementById('next-btn');
  var elHint     = document.getElementById('mode-hint');

  // ── Speech ────────────────────────────────────────────────────────────
  var SpeechAPI = null;
  try { SpeechAPI = window.SpeechRecognition || window.webkitSpeechRecognition || null; } catch(e) {}

  if (SpeechAPI) {
    elMic.style.display = 'block';
    elHint.textContent  = 'Tipp: Mikrofon-Taste drücken zum Sprechen';
  } else {
    elHint.textContent  = '⌨️ Texteingabe';
  }

  // ── Wire up buttons ────────────────────────────────────────────────────
  document.getElementById('start-btn').onclick = startQuiz;
  document.getElementById('send-btn').onclick  = submitText;
  elMic.onclick  = toggleMic;
  elNext.onclick = startQuiz; // overwritten in showRoundResult

  elInput.addEventListener('keydown', function(e) {
    if (e.keyCode === 13 || e.key === 'Enter') submitText();
  });

  // ── Screens ───────────────────────────────────────────────────────────
  function showScreen(name) {
    var screens = document.querySelectorAll('.screen');
    for (var i = 0; i < screens.length; i++) {
      screens[i].className = 'screen' + (screens[i].id === 'screen-' + name ? ' active' : '');
    }
  }

  // ── Quiz ──────────────────────────────────────────────────────────────
  function startQuiz() {
    queue = shuffle(VOCAB.slice());
    missed = []; results = []; repeatRound = false;
    showScreen('quiz');
    nextWord();
  }

  function nextWord() {
    answered = false;
    stopMic();
    elInput.value      = '';
    elHeard.textContent    = '';
    elFeedback.textContent = '';
    elFeedback.className   = '';

    if (queue.length === 0) { showRoundResult(); return; }

    current = queue.shift();
    elWord.textContent = current.de;
    setProgress();
    startTimer();
  }

  function startTimer() {
    clearInterval(timerInterval);
    timeLeft = 5;
    setTimerDisplay(5);

    timerInterval = setInterval(function() {
      timeLeft -= 1;
      setTimerDisplay(timeLeft);
      if (timeLeft <= 0) { clearInterval(timerInterval); if (!answered) timeOut(); }
    }, 1000);
  }

  function setTimerDisplay(t) {
    elTimer.textContent = t;
    elTimer.className =
      t <= 2 ? 'urgent' :
      t <= 3 ? 'warn'   : '';
  }

  function timeOut() {
    if (answered) return;
    answered = true; stopMic();
    markWrong('⏱ Zeit! → ' + current.it);
    setTimeout(nextWord, 1900);
  }

  function submitText() {
    if (answered) return;
    var val = elInput.value.replace(/^\s+|\s+$/g, '').toLowerCase();
    if (!val) return;
    answered = true;
    clearInterval(timerInterval);
    stopMic();
    evaluate(val);
  }

  function evaluate(text) {
    var ok = [current.it.toLowerCase()].concat(current.alt.map(function(a) { return a.toLowerCase(); }))
              .some(function(a) { return text.indexOf(a) !== -1; });
    if (ok) {
      elFeedback.textContent = '✓ Richtig!';
      elFeedback.className   = 'correct';
      results.push({ word: current, ok: true });
    } else {
      markWrong('✗ Falsch → ' + current.it);
    }
    setTimeout(nextWord, 1700);
  }

  function markWrong(msg) {
    elFeedback.textContent = msg;
    elFeedback.className   = 'wrong';
    missed.push(current);
    results.push({ word: current, ok: false });
  }

  // ── Results ───────────────────────────────────────────────────────────
  function showRoundResult() {
    var html = '<h2>' + (repeatRound ? 'Wiederholung' : 'Runde') + ' abgeschlossen</h2>';
    results.forEach(function(r) {
      html += '<div class="ri ' + (r.ok ? 'ok' : 'fail') + '"><span>' +
              r.word.de + '</span><span>' + r.word.it + '</span></div>';
    });
    elResult.innerHTML = html;

    if (missed.length > 0 && !repeatRound) {
      elNext.textContent = missed.length + ' Wort' + (missed.length > 1 ? 'e' : '') + ' wiederholen';
      elNext.onclick = startRepeat;
    } else {
      elNext.textContent = 'Neu starten';
      elNext.onclick = startQuiz;
    }
    showScreen('result');
  }

  function startRepeat() {
    queue = shuffle(missed.slice());
    missed = []; results = []; repeatRound = true;
    showScreen('quiz');
    nextWord();
  }

  // ── Mic ───────────────────────────────────────────────────────────────
  function toggleMic() { listening ? stopMic() : startMic(); }

  function startMic() {
    if (!SpeechAPI || listening || answered) return;
    try {
      recognition = new SpeechAPI();
      recognition.lang = 'it-IT';
      recognition.continuous = false;
      recognition.interimResults = true;

      recognition.onresult = function(e) {
        var t = '';
        for (var i = 0; i < e.results.length; i++) t += e.results[i][0].transcript;
        t = t.toLowerCase().replace(/^\s+|\s+$/g, '');
        elInput.value = t;
        elHeard.textContent = '„' + t + '“';
        if (e.results[e.results.length - 1].isFinal) { stopMic(); submitText(); }
      };
      recognition.onerror = function(e) {
        stopMic();
        if (e.error === 'no-speech' && !answered) timeOut();
      };
      recognition.onend = function() { listening = false; elMic.className = ''; elMic.textContent = '🎙️ Sprechen'; };

      recognition.start();
      listening = true;
      elMic.className = 'listening';
      elMic.textContent = '⏹ Stopp';
    } catch(e) {
      SpeechAPI = null;
      elMic.style.display = 'none';
    }
  }

  function stopMic() {
    if (recognition) { try { recognition.stop(); } catch(e) {} recognition = null; }
    listening = false;
    elMic.className = '';
    elMic.textContent = '🎙️ Sprechen';
  }

  // ── Helpers ───────────────────────────────────────────────────────────
  function setProgress() {
    elProgress.textContent = 'Wort ' + (VOCAB.length - queue.length) + ' / ' + VOCAB.length +
      (repeatRound ? ' · Wiederholung' : '');
  }

  function shuffle(arr) {
    for (var i = arr.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var tmp = arr[i]; arr[i] = arr[j]; arr[j] = tmp;
    }
    return arr;
  }

}());
</script>
</body>
</html>
