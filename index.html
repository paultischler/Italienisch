<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>Impara Italiano</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #1a1a2e; color: #eee;
      min-height: 100vh;
      display: flex; flex-direction: column;
      align-items: center; justify-content: flex-start;
      padding: 1rem; padding-top: 1.5rem;
    }

    h1 { font-size: 1.1rem; color: #a78bfa; margin-bottom: 1rem; text-align: center; letter-spacing: 0.08em; }

    #card {
      background: #16213e; border: 2px solid #a78bfa;
      border-radius: 1.5rem; width: 100%; max-width: 420px;
      padding: 1.2rem 1.2rem 1.5rem;
      box-shadow: 0 8px 40px rgba(167,139,250,0.15);
    }

    .screen { display: none; }
    .screen.active { display: block; }

    /* ── Category selection ── */
    #screen-start p { color: #9ca3af; font-size: 0.82rem; margin-bottom: 0.8rem; text-align: center; }
    #category-grid {
      display: grid; grid-template-columns: 1fr 1fr; gap: 0.45rem; margin-bottom: 0.45rem;
    }
    .cat-btn {
      background: #1e2a4a; border: 1.5px solid #374151; border-radius: 0.7rem;
      color: #e5e7eb; font-size: 0.8rem; font-weight: 600;
      padding: 0.7rem 0.4rem; cursor: pointer; text-align: center;
      line-height: 1.3; -webkit-appearance: none;
    }
    .cat-btn:active { background: #263354; border-color: #a78bfa; }
    .cat-btn-mix {
      width: 100%; background: rgba(167,139,250,0.13); border: 1.5px solid #a78bfa;
      border-radius: 0.7rem; color: #a78bfa; font-size: 0.88rem; font-weight: 700;
      padding: 0.75rem; cursor: pointer; text-align: center;
      margin-top: 0.2rem; -webkit-appearance: none;
    }
    .cat-btn-mix:active { background: rgba(167,139,250,0.28); }

    /* ── Quiz topbar ── */
    #quiz-topbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.6rem; }
    #progress { font-size: 0.72rem; color: #6b7280; text-transform: uppercase; letter-spacing: 0.07em; }
    #timer-display {
      width: 34px; height: 34px; border-radius: 50%; border: 3px solid #a78bfa;
      display: flex; align-items: center; justify-content: center;
      font-size: 0.95rem; font-weight: 700; color: #a78bfa;
      transition: border-color 0.3s, color 0.3s; flex-shrink: 0;
    }
    #timer-display.warn   { border-color: #fbbf24; color: #fbbf24; }
    #timer-display.urgent { border-color: #f87171; color: #f87171; }
    #timer-display.grace  { border-color: #374151; color: #6b7280; font-size: 0.7rem; }

    /* ── Dots ── */
    #dots { display: flex; gap: 0.4rem; margin-bottom: 0.8rem; flex-wrap: wrap; }
    .dot { width: 10px; height: 10px; border-radius: 50%; background: #374151; transition: background 0.3s; }
    .dot.done    { background: #34d399; }
    .dot.current { background: #a78bfa; }

    /* ── The big word ── */
    #word {
      font-size: 2.6rem; font-weight: 800; color: #f9fafb; text-align: center;
      margin: 1.8rem 0 1.6rem; line-height: 1.15; min-height: 4rem;
      display: flex; align-items: center; justify-content: center;
      word-break: break-word;
    }

    /* ── Mic & input ── */
    #mic-status { font-size: 0.72rem; color: #6b7280; text-align: center; margin-bottom: 0.7rem; min-height: 1em; }
    #answer-input {
      width: 100%; background: #0f172a; border: 1.5px solid #374151; border-radius: 0.6rem;
      color: #f9fafb; font-size: 1.05rem; padding: 0.7rem 1rem; outline: none; margin-bottom: 0.6rem;
    }
    #answer-input:focus { border-color: #a78bfa; }
    #answer-input::placeholder { color: #4b5563; }
    #heard    { font-size: 0.82rem; color: #9ca3af; min-height: 1.1em; font-style: italic; text-align: center; margin-bottom: 0.4rem; }
    #feedback { font-size: 1.1rem; font-weight: 700; min-height: 1.3em; text-align: center; }
    .correct  { color: #34d399; }
    .wrong    { color: #f87171; }

    /* ── Shared button ── */
    .btn {
      display: block; width: 100%; background: #a78bfa; color: white; border: none;
      border-radius: 0.75rem; padding: 0.85rem; font-size: 1rem; font-weight: 700;
      cursor: pointer; margin-top: 0.5rem; -webkit-appearance: none; text-align: center;
    }

    /* ── Results ── */
    #result-box { margin-bottom: 1rem; }
    #result-box h2 { font-size: 1rem; color: #a78bfa; text-align: center; margin-bottom: 0.8rem; }
    .ri {
      display: flex; justify-content: space-between; align-items: center;
      padding: 0.5rem 0.7rem; border-radius: 0.45rem; margin-bottom: 0.35rem; font-size: 0.9rem;
    }
    .ri.ok   { background: rgba(52,211,153,0.12); color: #34d399; }
    .ri.some { background: rgba(251,191,36,0.12);  color: #fbbf24; }
    .wrong-count { font-size: 0.75rem; opacity: 0.75; margin-left: 0.4rem; white-space: nowrap; }

    /* ── Joker FAB ── */
    #joker-fab {
      position: fixed; bottom: 1.8rem; right: 1.8rem;
      width: 72px; height: 72px; border-radius: 50%; background: #fbbf24; border: none;
      cursor: pointer; display: none; flex-direction: column; align-items: center;
      justify-content: center; gap: 4px; box-shadow: 0 6px 24px rgba(251,191,36,0.35);
      transition: opacity 0.2s, transform 0.15s, background 0.2s;
      -webkit-appearance: none; z-index: 100;
    }
    #joker-fab.visible  { display: flex; }
    #joker-fab:active   { transform: scale(0.93); }
    #joker-fab:disabled { background: #374151; box-shadow: none; cursor: default; opacity: 0.5; }
    #joker-label { font-size: 1rem; font-weight: 800; color: #1a1a2e; line-height: 1; }
    #joker-pips { display: flex; gap: 3px; }
    .pip { width: 7px; height: 7px; border-radius: 50%; background: rgba(26,26,46,0.5); }
    .pip.active { background: rgba(26,26,46,0.85); }
  </style>
</head>
<body>
  <h1>Impara Italiano</h1>
  <div id="card">

    <div id="screen-start" class="screen active">
      <p>Kategorie wählen – 5 zufällige Vokabeln:</p>
      <div id="category-grid"></div>

    </div>

    <div id="screen-quiz" class="screen">
      <div id="quiz-topbar">
        <div id="progress"></div>
        <div id="timer-display">5</div>
      </div>
      <div id="dots"></div>
      <div id="word"></div>
      <div id="mic-status"></div>
      <input id="answer-input" type="text" placeholder="Italiano …"
             autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" />
      <div id="heard"></div>
      <div id="feedback"></div>
    </div>

    <div id="screen-result" class="screen">
      <div id="result-box"></div>
      <button class="btn" id="next-btn">Kategorien</button>
    </div>

  </div>

  <button id="joker-fab" disabled>

    <div id="joker-pips"></div>

        { de: 'suchen',             it: 'cercare',           alt: [] },
        { de: 'arbeiten',           it: 'lavorare',          alt: [] },
        { de: 'eintreten',          it: 'entrare',           alt: [] },
        { de: 'bleiben',            it: 'restare',           alt: [] },
        { de: 'zurückkehren',       it: 'tornare',           alt: [] },
        { de: 'denken',             it: 'pensare',           alt: [] },
        { de: 'glauben',            it: 'credere',           alt: [] },
        { de: 'passieren',          it: 'succedere',         alt: [] }
      ]
    }
  ];

  // ── State ─────────────────────────────────────────────────────────────
  var currentRound = [];
  var queue = [], correctSet = {}, wrongCounts = {}, current = null;
  var timerInterval = null, timeLeft = 5;
  var recognition = null, quizActive = false, answered = false;
  var wordToken = 0;
  var jokersLeft = 3;

  // ── DOM ───────────────────────────────────────────────────────────────
  var elProgress  = document.getElementById('progress');
  var elDots      = document.getElementById('dots');
  var elWord      = document.getElementById('word');
  var elTimer     = document.getElementById('timer-display');
  var elMicStatus = document.getElementById('mic-status');
  var elInput     = document.getElementById('answer-input');
  var elHeard     = document.getElementById('heard');
  var elFeedback  = document.getElementById('feedback');
  var elResult    = document.getElementById('result-box');
  var elNext      = document.getElementById('next-btn');
  var elJoker     = document.getElementById('joker-fab');
  var elJokerPips = document.getElementById('joker-pips');

  // ── Speech API ────────────────────────────────────────────────────────
  var SpeechAPI = null;
  try { SpeechAPI = window.SpeechRecognition || window.webkitSpeechRecognition || null; } catch (e) {}

  // ── Build category buttons ────────────────────────────────────────────
  var grid = document.getElementById('category-grid');
  CATEGORIES.forEach(function (cat, i) {
    var btn = document.createElement('button');
    btn.className   = 'cat-btn';
    btn.textContent = cat.name;
    btn.onclick = (function (idx) {
      return function () { pickCategory(idx); };
    }(i));
    grid.appendChild(btn);
  });
  document.getElementById('mix-btn').onclick = function () { pickCategory(-1); };

  // ── Other buttons ─────────────────────────────────────────────────────
  elJoker.onclick = useJoker;
  elNext.onclick  = showCategoryScreen;
  elInput.addEventListener('keydown', function (e) {
    if (e.keyCode === 13 || e.key === 'Enter') onEnter();
  });

  // ── Category & quiz start ─────────────────────────────────────────────
  function showCategoryScreen() {
    quizActive = false;
    stopRecognition();
    clearInterval(timerInterval);
    elJoker.classList.remove('visible');
    showScreen('start');
  }

  function pickCategory(idx) {
    var pool;
    if (idx === -1) {
      var seen = {};
      pool = [];
      CATEGORIES.forEach(function (c) {
        c.words.forEach(function (w) {
          if (!seen[w.it]) { seen[w.it] = true; pool.push(w); }
        });
      });
    } else {
      pool = CATEGORIES[idx].words;
    }
    var selected = shuffle(pool.slice()).slice(0, 5);
    startQuiz(selected);
  }

  function startQuiz(words) {
    currentRound = words;
    queue = shuffle(words.slice());
    correctSet = {}; wrongCounts = {};
    words.forEach(function (v) { wrongCounts[v.de] = 0; });
    jokersLeft = 3;
    quizActive = true;
    elJoker.classList.add('visible');
    renderJokers();
    showScreen('quiz');
    nextWord();
  }

  function nextWord() {
    if (!quizActive) return;
    wordToken++;
    var token = wordToken;
    answered = false;

    stopRecognition();
    elInput.value          = '';
    elHeard.textContent    = '';
    elFeedback.textContent = '';
    elFeedback.className   = '';

    if (queue.length === 0) { finishQuiz(); return; }

    current = queue.shift();
    elWord.textContent = current.de;
    updateDots();
    updateProgress();
    startTimer(token);
    startWordRecognition(token);
  }

  // ── Joker ─────────────────────────────────────────────────────────────
  function useJoker() {
    if (jokersLeft <= 0 || answered) return;
    jokersLeft--;
    renderJokers();
    if (timeLeft > 0) {
      timeLeft += 3;
      renderTimer(timeLeft, timeLeft <= 2 ? 'urgent' : timeLeft <= 3 ? 'warn' : '');
    }
  }

  function renderJokers() {
    var html = '';
    for (var i = 0; i < 3; i++) {
      html += '<div class="pip' + (i < jokersLeft ? ' active' : '') + '"></div>';
    }
    elJokerPips.innerHTML = html;
    elJoker.disabled = jokersLeft <= 0;
  }

  // ── Timer ─────────────────────────────────────────────────────────────
  function startTimer(token) {
    clearInterval(timerInterval);
    timeLeft = 5;
    renderTimer(5, '');

    timerInterval = setInterval(function () {
      if (wordToken !== token) { clearInterval(timerInterval); return; }
      timeLeft--;
      if (timeLeft > 0) {
        renderTimer(timeLeft, timeLeft <= 2 ? 'urgent' : timeLeft <= 3 ? 'warn' : '');
      } else {
        clearInterval(timerInterval);
        renderTimer('...', 'grace');
        setTimeout(function () {
          if (wordToken === token && !answered) timeOut();
        }, 1500);
      }
    }, 1000);
  }

  function renderTimer(val, cls) {
    elTimer.textContent = val;
    elTimer.className   = cls || '';
  }

  // ── Answers ───────────────────────────────────────────────────────────
  function timeOut() {
    if (answered) return;
    answered = true;
    stopRecognition();
    wrongCounts[current.de]++;
    queue.push(current);
    elFeedback.textContent = 'Zeit! – ' + current.it;
    elFeedback.className   = 'wrong';
    setTimeout(nextWord, 1900);
  }

  function onEnter() {
    if (answered) return;
    var val = elInput.value.replace(/^\s+|\s+$/g, '').toLowerCase();
    if (!val) return;
    answered = true;
    clearInterval(timerInterval);
    evaluate(val);
  }

  function evaluate(text) {
    var ok = [current.it.toLowerCase()]
      .concat(current.alt.map(function (a) { return a.toLowerCase(); }))
      .some(function (a) { return text.indexOf(a) !== -1; });

    if (ok) {
      correctSet[current.de] = true;
      elFeedback.textContent = 'Richtig!';
      elFeedback.className   = 'correct';
    } else {
      wrongCounts[current.de]++;
      queue.push(current);
      elFeedback.textContent = 'Falsch – ' + current.it;
      elFeedback.className   = 'wrong';
    }
    updateDots();
    setTimeout(nextWord, 1700);
  }

  // ── Finish ────────────────────────────────────────────────────────────
  function finishQuiz() {
    quizActive = false;
    stopRecognition();
    clearInterval(timerInterval);
    elJoker.classList.remove('visible');

    var html = '<h2>Geschafft!</h2>';
    currentRound.forEach(function (v) {
      var c = wrongCounts[v.de], cls = c === 0 ? 'ok' : 'some';
      html += '<div class="ri ' + cls + '"><span>' + v.de + '</span><span>' + v.it;
      if (c > 0) html += '<span class="wrong-count">(' + c + 'x falsch)</span>';
      html += '</span></div>';
    });
    elResult.innerHTML = html;
    showScreen('result');
  }

  // ── Progress ──────────────────────────────────────────────────────────
  function updateProgress() {
    elProgress.textContent = Object.keys(correctSet).length + ' / ' + currentRound.length + ' richtig';
  }

  function updateDots() {
    var html = '';
    currentRound.forEach(function (v) {
      var cls = correctSet[v.de] ? 'dot done'
              : (current && v.de === current.de ? 'dot current' : 'dot');
      html += '<div class="' + cls + '" title="' + v.de + '"></div>';
    });
    elDots.innerHTML = html;
  }

  // ── Recognition ───────────────────────────────────────────────────────
  function startWordRecognition(token) {
    if (!SpeechAPI) { setMicStatus('Texteingabe'); return; }
    try {
      var rec = new SpeechAPI();
      rec.lang           = 'it-IT';
      rec.continuous     = false;
      rec.interimResults = true;

      rec.onresult = function (e) {
        if (wordToken !== token || answered) return;
        var last = e.results[e.results.length - 1];
        var t    = last[0].transcript.toLowerCase().replace(/^\s+|\s+$/g, '');
        elInput.value       = t;
        elHeard.textContent = '„' + t + '"';
        if (last.isFinal) {
          answered = true;
          clearInterval(timerInterval);
          stopRecognition();
          evaluate(t);
        }
      };

      rec.onerror = function (e) {
        if (wordToken !== token || answered) return;
        if (e.error !== 'no-speech' && e.error !== 'aborted') setMicStatus('Mikrofon-Fehler');
      };

      rec.onend = function () {
        if (wordToken !== token || answered) return;
        try {
          rec.start();
        } catch (ex) {
          setTimeout(function () {
            if (wordToken === token && !answered) startWordRecognition(token);
          }, 150);
        }
      };

      rec.start();
      recognition = rec;
      setMicStatus('Mikrofon aktiv');
    } catch (e) {
      SpeechAPI = null;
      setMicStatus('Texteingabe');
    }
  }

  function stopRecognition() {
    if (recognition) {
      var r = recognition;
      recognition = null;
      try { r.stop(); } catch (e) {}
    }
  }

  function setMicStatus(msg) {
    elMicStatus.textContent = msg;
  }

  // ── Helpers ───────────────────────────────────────────────────────────
  function showScreen(name) {
    var screens = document.querySelectorAll('.screen');
    for (var i = 0; i < screens.length; i++) {
      screens[i].className = 'screen' + (screens[i].id === 'screen-' + name ? ' active' : '');
    }
  }

  function shuffle(arr) {
    for (var i = arr.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var tmp = arr[i]; arr[i] = arr[j]; arr[j] = tmp;
    }
    return arr;
  }

}());
